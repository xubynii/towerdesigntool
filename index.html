<!doctype html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Tower Workspace: site, massing, analysis nodes and drawing sets for early tower design, in one page.">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<meta charset="utf-8">
<title>Tower Workspace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: full-bleed canvas; floating left panel + tool rail as one shape; fixed top-right action row; bottom cluster. Same furniture in all three spaces. */
:root{
  --surface:#fff; --soft:#f5f5f6; --border:#ececee; --ink:#28282b; --muted:#8f9096; --faint:#a5a6ab;
  --accent:#718878; --accent-soft:#eaf0ec; --accent-line:#d5e1d8; --stage:#fcfcfc; --black:#27272a; --on-black:#fff;
  --bad:#a36262; --bad-soft:#f6eaea; --warn:#a8842c; --warn-soft:#f5ecd6; --shadow:0 3px 16px #2424320c;
  --sans:'DM Sans',Arial,sans-serif; --mono:'DM Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --surface:#242629; --soft:#303236; --border:#383a3e; --ink:#eeeeee; --muted:#9a9ba1; --faint:#77787e;
    --accent:#8fa896; --accent-soft:#2c3630; --accent-line:#3d4a41; --stage:#191b1e; --black:#eeeeee; --on-black:#1b1c1f;
    --bad:#d08a8a; --bad-soft:#3a2a2a; --warn:#d1ac55; --warn-soft:#3a321c; --shadow:0 3px 16px #0006; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --surface:#242629; --soft:#303236; --border:#383a3e; --ink:#eeeeee; --muted:#9a9ba1; --faint:#77787e;
  --accent:#8fa896; --accent-soft:#2c3630; --accent-line:#3d4a41; --stage:#191b1e; --black:#eeeeee; --on-black:#1b1c1f;
  --bad:#d08a8a; --bad-soft:#3a2a2a; --warn:#d1ac55; --warn-soft:#3a321c; --shadow:0 3px 16px #0006; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--ink);font-family:var(--sans);font-size:12px;overflow:hidden;position:relative}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--soft)}
button:disabled{opacity:.35;cursor:default}
button.primary{background:var(--black);color:var(--on-black);border-color:var(--black);box-shadow:0 2px 4px #0002}
button.save{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
button.icon{border-color:transparent;background:transparent;padding:7px;line-height:0}
button.icon:hover{background:var(--soft)}
button.danger{color:var(--bad)}
:focus-visible{outline:2px solid #879c8d;outline-offset:2px}
input,select,textarea{background:var(--soft);border:1px solid transparent;border-radius:7px;padding:7px 8px;width:100%;min-width:0}
textarea{resize:vertical;font-family:var(--mono);font-size:11px}
svg.ic{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}

#stage{position:absolute;inset:0}
.space{position:absolute;inset:0}
#three{width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#labels span.sel{background:var(--black);color:var(--on-black);letter-spacing:.8px}
#labels span{position:absolute;transform:translate(-50%,-140%);font-size:9px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:1px 4px;border-radius:3px;white-space:nowrap}

/* left panel + rail */
#panel{position:absolute;right:12px;top:12px;bottom:12px;width:248px;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:5}
body[data-space="model"] #panel{border-radius:0 13px 13px 0;border-left:0}
#rail{position:absolute;right:260px;top:12px;bottom:12px;width:49px;background:var(--surface);border:1px solid var(--border);border-right:0;border-radius:13px 0 0 13px;box-shadow:-5px 3px 12px #24243208;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;z-index:5;overflow-y:auto;scrollbar-width:none}
#rail button{border:0;border-radius:8px;width:36px;height:36px;padding:0;display:grid;place-items:center;flex:none;background:transparent}
#rail button:hover{background:var(--soft)}
#rail button.on{background:var(--black);color:var(--on-black)}
#rail hr{width:25px;border:0;border-top:1px solid var(--border);margin:4px 0}
.phead{height:64px;padding:9px 12px;display:flex;align-items:center;gap:9px;flex:none}
.phead .brand{font-size:22px;line-height:1;width:25px;text-align:center}
.phead input{background:transparent;font-weight:600;font-size:13px;padding:4px}
.phead small{display:block;color:var(--muted);font-size:10px;padding-left:4px}
.tabs{display:flex;gap:4px;padding:0 10px 10px;border-bottom:1px solid var(--border);flex:none}
.tabs button{border:0;font-size:11px;padding:7px 9px;background:transparent;color:var(--muted)}
.tabs button.on{background:var(--soft);color:var(--ink);box-shadow:0 1px 3px #0001}
#pbody{flex:1;overflow-y:auto;min-height:0}
.section{padding:16px 13px;border-bottom:1px solid var(--border)}
.section h3{font-size:12px;font-weight:550;margin:0 0 14px;display:flex;align-items:center;gap:6px}
.section h3::before{content:"⌄";color:var(--faint)}
.section h3 span{margin-left:auto;color:var(--muted);font-weight:400;font-size:10px}
.field{margin-bottom:12px}
.field label,.lab{display:block;font-size:10px;color:var(--muted);margin-bottom:4px}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.switch-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;color:var(--muted)}
.switch{width:33px;height:20px;border-radius:10px;background:var(--border);border:0;padding:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(13px)}
.notice{font-size:10px;color:var(--muted);line-height:1.5;margin:8px 0 0}
.kv{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.kv b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:2px}
.li{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:5px;border:1px solid transparent;cursor:pointer;min-width:0}
.li:hover{background:var(--soft)}
.li.on{background:var(--accent-soft);border-color:var(--accent-line)}
.li .g{width:14px;text-align:center;color:var(--muted);flex:none}
.li .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li input.n{background:transparent;padding:0;border-radius:2px}
.li .x{border:0;background:transparent;padding:0 4px;color:var(--muted)}
.li .dot{width:8px;height:8px;border-radius:50%;flex:none}
.asset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.asset{border:1px solid var(--border);border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--surface);font-size:10px}
.asset.on{border-color:var(--accent);background:var(--accent-soft)}
.asset canvas{width:60px;height:48px}
.pfoot{display:flex;gap:4px;padding:8px;border-top:1px solid var(--border);flex:none}
.pfoot button{background:var(--soft);border:0;padding:6px 8px;font-size:11px}
.pfoot button.on{background:var(--accent-soft);color:var(--accent)}
details.cat{border-bottom:1px solid var(--border)}
details.cat summary{padding:10px 13px;cursor:pointer;display:flex;align-items:center;gap:7px;font-weight:550;list-style:none}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary span{margin-left:auto;color:var(--faint);font-weight:400;font-size:10px}
details.cat .list{padding:0 6px 8px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--border);border-radius:12px;padding:3px 8px;font-size:10px;background:var(--surface);display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--black);color:var(--on-black);border-color:var(--black)}
.chip i{width:7px;height:7px;border-radius:50%;display:inline-block}
.tag{font-size:10px;background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:2px 5px}

/* top right */
.topbar{position:absolute;left:max(22px,env(safe-area-inset-left,0px));right:324px;top:20px;display:flex;align-items:center;gap:8px;z-index:6;flex-wrap:wrap;justify-content:space-between}
body:not([data-space="model"]) .topbar{right:276px}
.tl,.tr{display:flex;align-items:center;gap:8px;flex:1 1 0;min-width:0}
.tr{justify-content:flex-end}
.pname{display:flex;align-items:center;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:2px 2px 2px 6px;min-width:0}
.pname input{background:transparent;font-weight:600;font-size:13px;padding:6px 4px;width:150px;field-sizing:content;min-width:70px;max-width:230px}
.pname button{padding:6px}
#pmenu{position:absolute;left:max(22px,env(safe-area-inset-left,0px));top:62px;width:262px;max-height:calc(100% - 90px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 40px #0000001f;z-index:16;padding:8px}
#pmenu .up{display:block;color:var(--muted);padding:6px 10px 8px;font-size:12px}
#pmenu .li{padding:8px 10px;gap:11px;font-size:13px;border-radius:8px}
#pmenu .li svg{width:16px;height:16px;flex:none}
#pmenu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}
#pmenu .li.danger{color:var(--bad)}
#pmenu .lab{padding:6px 10px 2px;margin:0;font-size:9px;letter-spacing:1.1px;text-transform:uppercase}
#pmenu .li small{margin-left:auto;color:var(--faint);font-size:10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;padding:6px 12px;border-radius:6px;background:transparent}
.seg button.on{background:var(--accent-soft);color:var(--ink);font-weight:500}
#saved{font-size:10px;color:var(--faint)}
.topbar select{width:auto;background:var(--surface);border:1px solid var(--border);padding:8px}
.row2{position:absolute;left:max(22px,env(safe-area-inset-left,0px));right:340px;top:66px;display:flex;gap:6px 18px;flex-wrap:wrap;z-index:4;align-items:center;pointer-events:none}
.row2>*{pointer-events:auto}
.row2.right{justify-content:flex-start;right:280px}
.met{font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.met small{font-size:9px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-left:4px}
.met em{font-style:normal;font-size:10px;margin-left:4px;color:var(--accent)}
.met em.bad{color:var(--warn)}
.row2 button{padding:6px 10px}

/* bottom */
#hint{position:absolute;left:300px;bottom:62px;right:325px;display:flex;gap:10px;align-items:center;font-size:10px;color:var(--faint);pointer-events:none}
#compass{width:38px;height:38px;flex:none}
.pill{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:0 2px 10px #0001;display:flex;padding:3px;gap:2px;z-index:4;align-items:center}
.pill button{border:0;padding:6px 8px;line-height:0;background:transparent}
.pill button.t{line-height:1;font-weight:600}
.pill button.on{background:var(--accent-soft)}
#pillL{right:322px;bottom:20px}
.thint{font-size:11px;line-height:1.55;color:var(--muted);margin:0 0 14px}
.thint b{color:var(--ink);font-weight:600}
.tseg{display:flex;background:var(--soft);border-radius:8px;padding:3px;gap:2px;margin-bottom:12px}
.tseg button{flex:1;border:0;background:transparent;padding:6px 4px;border-radius:6px;font-size:11px}
.tseg button.on{background:var(--surface);box-shadow:0 1px 3px #0001;font-weight:500}
#hint.toolon #hintText{display:none}
#vmenu{position:absolute;left:85px;bottom:66px;width:226px;max-height:70%;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:8;padding:6px}
#vmenu .lab{padding:8px 8px 4px;margin:0;letter-spacing:1.1px;text-transform:uppercase;font-size:9px}
#vmenu .switch-row{padding:5px 8px;color:var(--ink)}
#vmenu .li kbd{margin-left:auto}
#dimbox{position:absolute;background:var(--surface);border:1px solid var(--ink);border-radius:4px;padding:3px 8px;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;pointer-events:none;z-index:3}
#dimbox.typing{border-color:#2f63e0;box-shadow:0 0 0 2px #c7d3f6}
#dtag{position:absolute;transform:translate(14px,-160%);background:#4f7a60;color:#fff;font-size:11px;padding:3px 8px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:3;font-variant-numeric:tabular-nums}
#pillC{left:50%;bottom:20px;transform:translateX(-10%);padding:8px 14px;gap:26px;color:var(--muted);cursor:pointer}
#pillR{left:85px;bottom:22px}
#help{position:absolute;left:max(22px,env(safe-area-inset-left,0px));bottom:22px;width:40px;height:40px;border-radius:9px;font-size:18px;padding:0;z-index:4;box-shadow:0 2px 10px #0001}
#toast{position:absolute;left:50%;bottom:76px;transform:translateX(-50%);background:var(--black);color:var(--on-black);padding:9px 14px;border-radius:8px;z-index:30;font-size:12px;pointer-events:none}

/* node preview card */
#rcol{position:absolute;left:max(22px,env(safe-area-inset-left,0px));top:104px;bottom:76px;width:262px;display:flex;flex-direction:column;gap:12px;z-index:4;pointer-events:none}
#rcol>*{pointer-events:auto}
#rpanel{flex:1;min-height:0;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
#rpanel .tabs{padding:10px 8px;gap:2px}
#rpanel .tabs button{padding:7px 8px}
#rbody{flex:1;overflow-y:auto;min-height:0}
#prev{flex:none;order:-1;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow);padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
#prev>svg{width:100%;height:96px;display:block;cursor:pointer}
.pdots{display:flex;align-items:center;gap:5px;font-size:10px;letter-spacing:0;font-variant-numeric:tabular-nums}
.pdots i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-left:5px}
.pdots i:first-child{margin-left:0}
.gdots{display:flex;align-items:center;gap:3px;border-top:1px solid var(--border);padding-top:9px}
.gd{width:24px;height:24px;border-radius:50%;padding:0;display:grid;place-items:center;color:var(--muted);flex:none}
.gd i{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.gd.done{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.gd.done i{background:var(--accent)}
.gd.cur{background:var(--black);border-color:var(--black);color:var(--on-black)}
.gd.cur i{background:var(--on-black)}
.gfold{margin-left:auto;border:0;background:transparent;padding:2px 6px;color:var(--muted)}
.gtext{display:flex;flex-direction:column;gap:3px}
.gtext b{font-size:12px;font-weight:600}
.gtext span{color:var(--muted);font-size:11px;line-height:1.4}
.gact{display:flex;gap:6px}
#prev .ph{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:10px;letter-spacing:1.2px;text-transform:uppercase}
.mix{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--soft)}

/* nodes */
#nc{position:absolute;inset:0;overflow:hidden;touch-action:none;background-image:radial-gradient(var(--border) 1px,transparent 1px);background-size:22px 22px}
#nl{position:absolute;left:0;top:0;transform-origin:0 0}
#nw{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible}
#nw path{fill:none;stroke:var(--muted);stroke-width:1.4;pointer-events:stroke;cursor:pointer}
#nw path.sel{stroke:var(--accent);stroke-width:2.4}
#nw path.tmp{stroke-dasharray:4 4;pointer-events:none}
.grp{position:absolute;border:1px dashed var(--border);border-radius:14px;background:color-mix(in srgb,var(--soft) 45%,transparent)}
.grp b{position:absolute;left:12px;top:-18px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap}
.node{position:absolute;width:200px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 2px 8px #24243210;user-select:none}
.node.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-line)}
.nh{height:40px;display:flex;align-items:center;gap:7px;padding:0 6px 0 11px;cursor:grab}
.nh i{width:8px;height:8px;border-radius:50%;flex:none}
.nh b{flex:1;font-weight:550;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nh button{border:0;background:transparent;padding:3px 5px;color:var(--muted);font-size:13px;line-height:1}
.nh button:hover{color:var(--ink);background:var(--soft)}
.np{position:relative}
.port{position:absolute;height:20px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--muted)}
.port i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--muted);background:var(--surface);display:block;flex:none}
.port.in{left:-5px}
.port.out{right:-5px;flex-direction:row-reverse;cursor:crosshair}
.port.out i{background:var(--ink);border-color:var(--ink)}
.port.hot i{border-color:var(--accent);background:var(--accent)}
.nv{height:30px;margin-top:8px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;padding:0 11px;font-size:10.5px}
.nv em{font-style:normal;white-space:nowrap;color:var(--muted)}
.nv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.ntext{display:block;width:calc(100% - 22px);margin:8px 11px 0;height:68px;resize:none;font-family:var(--sans);font-size:11px;line-height:1.4;background:var(--accent-soft);user-select:text}
.st-pass .nv em{color:var(--accent)} .st-fail .nv em{color:var(--bad)} .st-warn .nv em{color:var(--warn)}
.nh button.stb{color:var(--accent)}
/* map: select site boundary */
#mapsel{position:absolute;inset:0;z-index:17;background:#f7f7f8;color:#28282b}
#mapcv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#mapsel.draw #mapcv{cursor:crosshair}
.mtop{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;width:min(470px,calc(100% - 90px));pointer-events:none}
.mtop>*{pointer-events:auto}
.mtop b{font-size:12px;font-weight:600}
.mrow{display:flex;gap:8px;width:100%}
.msearch{position:relative;flex:1;min-width:0}
.msearch svg{position:absolute;left:9px;top:8px;width:15px;height:15px;color:#8f9096;pointer-events:none}
.msearch input{background:#fff;border:1px solid #e2e2e6;border-radius:8px;padding:8px 10px 8px 30px;color:#28282b;box-shadow:0 1px 4px #0000000d}
#mapres{position:absolute;left:0;right:0;top:38px;background:#fff;border:1px solid #e2e2e6;border-radius:10px;box-shadow:0 8px 24px #0000001a;padding:5px;max-height:260px;overflow:auto;z-index:2}
#mapres .li{color:#28282b}
#mapres .li:hover{background:#f1f1f3}
#mapres .li span:last-child{margin-left:auto;color:#8f9096;font-size:10px}
#mapDrawB{background:#fff;border-color:#e2e2e6;color:#28282b;box-shadow:0 1px 4px #0000000d}
#mapsel.draw #mapDrawB{background:#27272a;color:#fff;border-color:#27272a}
#maphint{font-size:11px;color:#8f9096;background:#f7f7f8cc;padding:1px 8px;border-radius:6px}
#mapx{position:absolute;right:14px;top:8px;font-size:20px;line-height:1;color:#28282b;background:#fff;border:1px solid #e2e2e6;padding:5px 9px}
#mapzoom{right:16px;bottom:18px;background:#fff;border-color:#e2e2e6}
#mapzoom button{color:#28282b;padding:7px 10px}
#mapbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e2e2e6;border-radius:12px;box-shadow:0 8px 28px #0000001f;padding:8px 8px 8px 14px;max-width:calc(100% - 32px);flex-wrap:wrap}
#mapbar span{font-size:12px;margin-right:6px;font-variant-numeric:tabular-nums}

  if(el.dataset.note){P.graph.nodes.find(x=>x.id===el.dataset.note).text=el.value;unsaved();return}
  if(el.dataset.memo){const n=P.graph.nodes.find(x=>x.id===(ST.id||S.nopen));if(n){n.memo=el.value;unsaved()}return}
  if(el.dataset.live){const n=P.graph.nodes.find(x=>x.id===ST.id);n.params[el.dataset.live]=+el.value;$('#stHourV').textContent=hm(+el.value);unsaved();evaluate();stRefresh();return}
  if(el.dataset.in){S[el.dataset.in]=el.value;ui()}if(el.id==='title'){P.title=el.value;$('#phProj').textContent=el.value;unsaved()}if(el.id==='palq')palList(el.value)});
const CMDS=[['Save project',save],['Fit drawing',()=>ACT.fit()],['Go to Model',()=>go('model')],['Go to Nodes',()=>go('nodes')],['Go to Presentation',()=>go('pres')],['Import site',()=>importDlg('site')],['Import massing',()=>importDlg('massing')],['Export project',()=>exportDlg('project')],['Create drawing set',()=>{go('pres');ACT.makeSet()}],['Set up your own node',()=>ACT.newNode()],['Plan view',()=>applyView(P.views[1])],['Axonometric view',()=>applyView(P.views[0])]]
  .concat(TOOLS.filter(Boolean).map(t=>['Tool: '+t[1],()=>{go('model');ACT.tool({t:t[0]})}]));
function palette(){dialog('Commands','<input id="palq" placeholder="Type a command" aria-label="Search commands"><div class="list" id="pall"></div>');palList('');$('#palq').focus()}
function palList(q){$('#pall').innerHTML=CMDS.map((c,i)=>c[0].toLowerCase().includes(q.toLowerCase())?'<div class="li" data-act="cmd" data-i="'+i+'"><span class="n">'+c[0]+'</span></div>':'').join('')}
document.addEventListener('keydown',e=>{const tg=e.target.tagName,typing=tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT';
  if(!$('#mcheck').hidden){if(e.key==='Escape')ACT.mcCancel();return}
  if(e.key==='Escape'&&!$('#pmenu').hidden){$('#pmenu').hidden=true;return}
  if(e.key==='Enter'&&e.target.id==='title'){e.target.blur();return}
  if(!$('#report').hidden){if(e.key==='Escape')ACT.repClose();return}
  if(!$('#mapsel').hidden){if(e.key==='Escape'){if(MS.draw){ACT.mapDraw()}else ACT.mapClose();return}if(e.target.id==='mapq'){if(e.key==='Enter'){const f=$('#mapres .li[data-act]');if(f)f.click()}return}
    if(MS.draw&&(e.key==='Backspace'||e.key==='Delete')){e.preventDefault();MS.draw.pop();mapUi();return}if(MS.draw&&e.key==='Enter'){mapCloseDraw();return}return}
  if(e.key==='Escape'){if(!$('#dlg').hidden){$('#dlg').hidden=true;return}if(!$('#studio').hidden){closeStudio();ui();return}$('#quick').hidden=true;if(S.space==='model'){linePts=[];meas=[];setPrev([],0);setTool('select');S.place=null;if(S.sel){S.sel=null;rebuild()}ui()}return}
  if(typing){if(e.key==='Enter'&&e.target.id==='palq'){const f=$('#pall .li');if(f)f.click()}return}
  if(draft&&S.space==='model'){const d=draft,k=e.key;   // while drafting a line: typed length / angle, Tab, Enter, Backspace
    if(/^[0-9.]$/.test(k)||(k==='-'&&d.field==='ang')){e.preventDefault();d[d.field]+=k;applyDraftTyped();drawDraft();return}
    if(k==='Tab'){e.preventDefault();d.field=d.field==='len'?'ang':'len';drawDraft();return}
    if(k==='Enter'){e.preventDefault();if(d.len!==''||d.ang!=='')draftClick();else finishDraft(S.line.mode==='free'&&d.pts.length>=3);return}
    if(k==='Backspace'||k==='Delete'){e.preventDefault();if(d[d.field]!==''){d[d.field]=d[d.field].slice(0,-1);applyDraftTyped()}else if(d.pts.length>1)d.pts.pop();else{cancelDraft();hint(lineHint());return}drawDraft();return}}
  if(e.shiftKey&&e.code==='Space'){e.preventDefault();palette();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?ACT.redo():ACT.undo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();ACT.redo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();save();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'&&S.space==='model'&&S.typed){S.typed=S.typed.slice(0,-1);hintTyped();return}
  if(e.key==='Delete'||e.key==='Backspace'){
    if(S.space==='model'&&S.sel)del();
    else if(S.space==='nodes'){if(S.wsel!=null){P.graph.wires.splice(S.wsel,1);S.wsel=null;graphChanged()}else if(S.nsel)ACT.nDel({id:S.nsel})}
    else if(S.space==='pres'&&S.isel)ACT.delItem();return}
  if(S.space!=='model')return;
  if(['pull','off','len','copy'].includes(S.tool)){if(/^[0-9.\-]$/.test(e.key)){S.typed=(S.typed||'')+e.key;hintTyped();return}if(e.key==='Enter'&&S.typed){applyTyped();return}}
  if(e.key==='Enter'&&S.tool==='split'&&S.cut&&S.cut.b){commitSplit();return}
  if(!S.typed&&!S.sticky&&['1','2','3'].includes(e.key)&&!['pull','off','len','copy'].includes(S.tool)){applyView(P.views.find(v=>v.id===({1:'axo',2:'plan',3:'sec'})[e.key]));return}
  if(e.key.toLowerCase()==='f'&&e.shiftKey){ACT.fit();return}
  const t=TOOLS.find(t=>t&&t[2]&&t[2].toLowerCase()===e.key.toLowerCase());if(t)ACT.tool({t:t[0]})});
window.addEventListener('resize',()=>{resize();if(S.space==='pres')drawSheetView()});

/* ---------- boot ---------- */
function boot(){const rs=document.createElement('style');rs.textContent=REPORT_CSS;document.head.appendChild(rs);
  try{const ix=idxGet();if(ix.cur)P=loadProject(ix.cur);if(!P){const j=localStorage.getItem(KEY);if(j){const o=JSON.parse(j);if(o&&o.site&&o.masses)P=Object.assign(example(),o)}}}catch(e){}
  const fresh=!P;if(fresh)P=example();
  $('#title').value=P.title;$('#phProj').textContent=P.title;$('#saved').textContent=fresh?'Example project, not saved yet':'Opened from this browser';
  $('#rail').innerHTML=TOOLS.map(t=>t?'<button data-act="tool" data-t="'+t[0]+'" title="'+t[1]+(t[2]?' ('+t[2]+')':'')+'" aria-label="'+t[1]+'"><svg class="ic" viewBox="0 0 20 20"><path d="'+t[3]+'"/></svg></button>':'<hr>').join('');
  if(innerWidth<700)document.body.classList.add('collapsed');
  fillSites();init3();M=metrics();if(!P.graph.nodes.length)setPreset('climate');if(fresh)log('Example project opened');
  S.last=snapM();evaluate();go('model');setTool('select');resize();fit();frame();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.space==='pres')drawSheetView()});
  try{const q=new URLSearchParams(location.search);if(q.has('link')){const pt=parseInt(q.get('link'),10);LK.port=pt>0?pt:(+location.port||LK.port);LK.open=true;S.step='Massing';ui();lkConnect(true)}}catch(e){}
}
boot();
})();
</script>
